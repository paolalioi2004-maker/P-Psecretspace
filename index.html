<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P & P</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #f4f1eb;
            height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
        }

        .screen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            width: 100%;
            max-width: 700px;
            animation: fadeIn 2s ease;
        }

        .title {
            font-size: clamp(75px, 13vw, 160px);
            font-weight: normal;
            letter-spacing: -6px;
        }

        .subtitle {
            margin-top: 25px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        button {
            margin-top: 60px;
            padding: 14px 32px;
            background: transparent;
            border: 1px solid rgba(244,241,235,0.5);
            color: #f4f1eb;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        button:hover {
            background: #f4f1eb;
            color: #080808;
        }

        .chapter {
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 5px;
            opacity: 0.4;
            margin-bottom: 35px;
        }

        .question {
            font-size: clamp(25px, 4vw, 42px);
            font-weight: normal;
            line-height: 1.4;
        }

        .question em {
            font-style: italic;
        }

        .question strong {
            font-weight: normal;
        }

        .input {
            margin-top: 45px;
            width: 240px;
            padding: 13px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(244,241,235,0.5);
            color: #f4f1eb;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        .input::placeholder {
            color: rgba(244,241,235,0.35);
        }

        .message {
            margin-top: 25px;
            min-height: 20px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .hidden {
            display: none;
        }

        .credits {
            position: absolute;
            bottom: 25px;
            font-family: Arial, sans-serif;
            font-size: 8px;
            letter-spacing: 3px;
            opacity: 0.25;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- INTRO -->

    <section class="screen" id="intro">

        <div class="content">

            <h1 class="title">P &amp; P</h1>

            <p class="subtitle">
                un film di noi
            </p>

            <button onclick="startFilm()">
                SCHIACCIA PLAY
            </button>

        </div>

        <p class="credits">
            2025 — ∞
        </p>

    </section>


    <!-- PRIMO ENIGMA -->

    <section class="screen hidden" id="chapter1">

        <div class="content">

            <p class="chapter">
                SCENA 01 — IL PRIMO INCONTRO
            </p>

            <h2 class="question">
                Io ero fidanzata.<br><br>

                Avevo delle treccine lunghissime.<br><br>

                E tu mi sei stato presentato come
                <em>“un tizio che andava dietro alla mia unica amica single”.</em>
                <br><br>

                Ironico, considerando dove siamo finiti.
                <br><br>

                Ma torniamo all'inizio.
                <br><br>

                <strong>Che data era?</strong>
            </h2>

            <input
                id="answer"
                class="input"
                type="text"
                placeholder="GG / MM / AAAA"
                autocomplete="off"
            >

            <br>

            <button onclick="checkAnswer()">
                CONFERMA
            </button>

            <div class="message" id="message"></div>

        </div>

    </section>


    <script>

        function startFilm() {

            document.getElementById("intro").classList.add("hidden");

            document.getElementById("chapter1").classList.remove("hidden");

        }


        function checkAnswer() {

            const answer = document
                .getElementById("answer")
                .value
                .trim();

            const message = document.getElementById("message");


            /*
             * INSERISCI QUI LA VOSTRA DATA.
             *
             * Esempio:
             * const correctAnswer = "14/05/2024";
             */

            const correctAnswer = "INSERISCI_DATA";


            if (answer === correctAnswer) {

                message.innerHTML = "✓ CORRETTO.";

                message.style.opacity = "1";

                setTimeout(() => {

                    message.innerHTML =
                        "Ma questa è solo l'inizio...";

                }, 1200);

            } else {

                message.innerHTML =
                    "Non proprio. Torna indietro nel tempo.";

            }

        }

    </script>

</body>
</html>
